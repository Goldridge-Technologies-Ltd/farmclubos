# Optional local infrastructure. Development against Supabase needs none of
# this — it exists for working offline and for the VPS deployment target, where
# Postgres runs beside the API rather than as a managed service.
#
#   docker compose up -d postgres   # then point DATABASE_URL at it
#   docker compose up -d mailpit    # catches invite emails, UI on :8025
#   docker compose up -d rustfs     # S3 storage for STORAGE_DRIVER=s3, console on :9001
services:
  postgres:
    # Pin to the major version Supabase runs, so local and hosted agree.
    image: postgres:17-alpine
    container_name: farmclub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: farmclub
      POSTGRES_PASSWORD: farmclub
      POSTGRES_DB: farmclub
    ports:
      - "5432:5432"
    volumes:
      - farmclub-postgres-data:/var/lib/postgresql/data
      # Supabase's roles, which the row-level security migrations expect.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farmclub -d farmclub"]
      interval: 5s
      timeout: 5s
      retries: 10

  # A local SMTP sink, so invite and password-reset emails can be read without
  # sending anything. The API's `log` mail driver needs no container at all.
  mailpit:
    image: axllent/mailpit:latest
    container_name: farmclub-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  # S3-compatible file storage for lesson videos, captions and still images,
  # standing in for Cloudflare R2: the API talks to both the same way. Point
  # the STORAGE_* settings in api/.env at it, then run
  # `npm run storage:setup --workspace api` once to create the bucket.
  rustfs:
    image: rustfs/rustfs:1.0.0
    container_name: farmclub-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ACCESS_KEY: farmclub
      RUSTFS_SECRET_KEY: farmclub-dev-secret # allowlist secret: local development only
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - farmclub-rustfs-data:/data

volumes:
  farmclub-postgres-data:
  farmclub-rustfs-data:
